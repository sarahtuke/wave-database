<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Places API key test</title>
<style>
  body{font-family:monospace;background:#0b0f1a;color:#cfd6e6;padding:2rem;}
  button{padding:.5rem 1rem;font-family:inherit;cursor:pointer;}
  #out{margin-top:1.5rem;white-space:pre-wrap;}
  .ok{color:#7ee787;} .err{color:#ff7b72;}
  li{margin-bottom:.5rem;}
</style>
</head>
<body>

<h1>Places API key test</h1>
<p>Searches near Rotterdam (51.9225, 4.4792) as a throwaway sanity check for the key + restrictions.</p>
<button id="run">Run test search</button>
<div id="out">Click the button.</div>

<script src="config.js"></script>
<script>
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
    key: window.APP_CONFIG.GOOGLE_PLACES_API_KEY,
    v: "weekly",
  });

  const out = document.getElementById('out');

  document.getElementById('run').addEventListener('click', async () => {
    out.textContent = 'Loading Places library...';
    out.className = '';
    try {
      const { Place } = await google.maps.importLibrary("places");

      const request = {
        fields: ['displayName', 'location', 'types'],
        locationRestriction: {
          center: { lat: 51.9225, lng: 4.4792 },
          radius: 500,
        },
        maxResultCount: 5,
      };

      const { places } = await Place.searchNearby(request);

      if (!places || !places.length) {
        out.textContent = 'Call succeeded but returned zero places. Key/restrictions are working.';
        out.className = 'ok';
        return;
      }

      out.innerHTML = '<span class="ok">Success — key and restrictions are working.</span><ul>' +
        places.map(pl => `<li>${pl.displayName} — ${(pl.types||[]).slice(0,3).join(', ')}</li>`).join('') +
        '</ul>';
    } catch (err) {
      out.textContent = 'FAILED: ' + (err && err.message ? err.message : err);
      out.className = 'err';
      console.error(err);
    }
  });
</script>
</body>
</html>
