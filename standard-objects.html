<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Catalogue · Standard Objects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1015;--bg2:#141720;--bg3:#1a1d25;--bg4:#21252e;--bg5:#262a34;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);--bd3:rgba(255,255,255,0.22);
  --t1:#dedad0;--t2:#8a8880;--t3:#4e4d4a;--t4:#2b2a28;
  --ac:#7F77DD;--ac2:#EF9F27;
  --cA:#888780;--cB:#639922;--cC:#7F77DD;--cD:#378ADD;--cE:#EF9F27;
  --pulse:#EF9F27;--sustained:#378ADD;--press:#7F77DD;--ramp:#D85A30;
}
html,body{background:var(--bg);color:var(--t1);font-family:'Courier New',monospace;font-size:12px;min-height:100vh}

/* ── TOPBAR ── */
#topbar{height:42px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:100}
.logo{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--t1)}
.logo em{color:var(--t3);font-style:normal}
.tb-div{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.tb-stat{font-size:9px;color:var(--t3);white-space:nowrap}
.tb-stat strong{color:var(--t2)}
.tb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
.flt{font-size:9px;padding:3px 10px;border:1px solid var(--bd);border-radius:4px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s;white-space:nowrap}
.flt:hover{border-color:var(--bd2);color:var(--t2)}
.flt.on{border-color:rgba(127,119,221,.5);color:var(--ac);background:rgba(127,119,221,.07)}
.search-wrap{position:relative}
#search{background:var(--bg3);border:1px solid var(--bd);color:var(--t1);font-family:'Courier New',monospace;font-size:9px;padding:3px 10px 3px 24px;border-radius:4px;width:160px;outline:none;letter-spacing:.03em}
#search::placeholder{color:var(--t3)}
#search:focus{border-color:var(--bd2)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--t3);pointer-events:none}
.back-btn{font-size:9px;padding:3px 10px;border:1px solid var(--bd);border-radius:4px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s;text-decoration:none;display:flex;align-items:center;gap:5px}
.back-btn:hover{border-color:var(--bd2);color:var(--t2)}

/* ── SUBBAR ── */
#subbar{height:34px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:8px;position:sticky;top:42px;z-index:99}
.fn-flt{font-size:8px;padding:2px 8px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s}
.fn-flt:hover{border-color:var(--bd2);color:var(--t2)}
.fn-flt.on{border-color:var(--fn-col,var(--bd2));color:var(--fn-col,var(--t2));background:var(--fn-bg,transparent)}
.fn-1{--fn-col:rgba(136,135,128,0.8);--fn-bg:rgba(136,135,128,0.06)}
.fn-2{--fn-col:rgba(55,138,221,0.8);--fn-bg:rgba(55,138,221,0.06)}
.fn-3{--fn-col:rgba(99,153,34,0.8);--fn-bg:rgba(99,153,34,0.06)}
.fn-4{--fn-col:rgba(159,119,221,0.8);--fn-bg:rgba(159,119,221,0.06)}
#result-count{margin-left:auto;font-size:9px;color:var(--t3)}

/* ── GRID ── */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--bd);min-height:200px}
.cell-bg{background:var(--bg)}

/* ── CARD ── */
.cpm-card{background:var(--bg3);display:flex;flex-direction:column;height:100%;cursor:pointer;transition:background .12s}
.cpm-card:hover{background:var(--bg4)}
.cpm-card.active{background:var(--bg4);outline:1px solid var(--ac)}

/* diagram zone */
.dz{height:148px;background:var(--bg2);border-bottom:1px solid var(--bd);position:relative;overflow:hidden;flex-shrink:0}
.dz svg{width:100%;height:100%}
.scale-pips{position:absolute;bottom:8px;right:8px;display:flex;gap:2px}
.sp{width:5px;height:5px;border-radius:50%;background:var(--t4);transition:background .2s}
.sp.on{background:var(--ac2)}
.cell-badge{position:absolute;top:8px;left:8px;font-size:7px;letter-spacing:.07em;padding:2px 6px;border-radius:3px;border:1px solid;background:var(--bg)}

/* card body */
.cb{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card-name{font-size:10px;font-weight:bold;color:var(--t1);line-height:1.35;flex:1}
.card-id{font-size:8px;color:var(--t3);flex-shrink:0;margin-top:1px;letter-spacing:.04em}
.card-tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:.04em}
.tag-A{border-color:rgba(136,135,128,.3);color:#888780}
.tag-B{border-color:rgba(99,153,34,.3);color:#639922}
.tag-C{border-color:rgba(127,119,221,.3);color:#7F77DD}
.tag-D{border-color:rgba(55,138,221,.3);color:#378ADD}
.tag-E{border-color:rgba(239,159,39,.3);color:#EF9F27}
.tag-fn{border-color:var(--bd2);color:var(--t2)}
.card-desc{font-size:9px;color:var(--t2);line-height:1.6}
.scale-label{font-size:8px;color:var(--t3)}
.scale-label span{color:var(--ac2)}

/* disturbance strip */
.dis-strip{display:flex;gap:3px;margin-top:auto;padding-top:8px;border-top:1px solid var(--bd)}
.ds{flex:1;height:20px;border-radius:3px;border:1px solid;display:flex;align-items:center;justify-content:center}
.ds-lbl{font-size:7px;letter-spacing:.02em}
.ds.pulse-p{background:rgba(239,159,39,.1);border-color:rgba(239,159,39,.5)}.ds.pulse-p .ds-lbl{color:#EF9F27}
.ds.pulse-s{background:transparent;border-color:rgba(239,159,39,.25)}.ds.pulse-s .ds-lbl{color:rgba(239,159,39,.5)}
.ds.sustained-p{background:rgba(55,138,221,.1);border-color:rgba(55,138,221,.5)}.ds.sustained-p .ds-lbl{color:#378ADD}
.ds.sustained-s{background:transparent;border-color:rgba(55,138,221,.25)}.ds.sustained-s .ds-lbl{color:rgba(55,138,221,.5)}
.ds.press-p{background:rgba(127,119,221,.1);border-color:rgba(127,119,221,.5)}.ds.press-p .ds-lbl{color:#7F77DD}
.ds.press-s{background:transparent;border-color:rgba(127,119,221,.25)}.ds.press-s .ds-lbl{color:rgba(127,119,221,.5)}
.ds.ramp-p{background:rgba(216,90,48,.1);border-color:rgba(216,90,48,.5)}.ds.ramp-p .ds-lbl{color:#D85A30}
.ds.ramp-s{background:transparent;border-color:rgba(216,90,48,.25)}.ds.ramp-s .ds-lbl{color:rgba(216,90,48,.5)}
.ds.off{background:transparent;border-color:var(--bd);opacity:.25}.ds.off .ds-lbl{color:var(--t3)}

/* ── DETAIL DRAWER ── */
#drawer{position:fixed;right:0;top:0;bottom:0;width:360px;min-width:260px;max-width:90vw;background:var(--bg2);border-left:1px solid var(--bd2);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:200;display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translateX(0)}
#drawer.resizing{transition:none;user-select:none}
#drawer-handle{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:10;background:transparent}
#drawer-handle:hover,#drawer-handle:active{background:rgba(127,119,221,0.18)}
.dr-head{padding:14px 16px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dr-close{position:absolute;top:12px;right:14px;background:none;border:1px solid var(--bd);color:var(--t2);cursor:pointer;font-size:9px;padding:2px 8px;border-radius:3px;font-family:'Courier New',monospace;letter-spacing:.04em}
.dr-close:hover{border-color:var(--bd2);color:var(--t1)}
.dr-id{font-size:8px;letter-spacing:.1em;color:var(--t3);margin-bottom:4px}
.dr-name{font-size:14px;color:var(--t1);line-height:1.3;margin-bottom:8px;padding-right:60px}
.dr-tags{display:flex;gap:3px;flex-wrap:wrap}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px}
.dr-diagram{height:160px;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.dr-diagram svg{width:100%;height:100%}
.dr-section{margin-bottom:14px}
.dr-sec-title{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.dr-desc{font-size:9px;color:var(--t2);line-height:1.65}
.dr-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:9px}
.dr-meta-label{color:var(--t3);width:72px;flex-shrink:0;font-size:8px;letter-spacing:.04em}
.dr-meta-val{color:var(--t2)}
.dr-dis-strip{display:flex;gap:3px}
.dr-source{font-size:8px;color:var(--t3);font-style:italic;border-top:1px solid var(--bd);padding-top:10px;margin-top:2px}
.dr-tags-section{display:flex;flex-wrap:wrap;gap:3px}
.dr-tag-chip{font-size:8px;padding:2px 7px;border-radius:3px;background:var(--bg3);border:1px solid var(--bd);color:var(--t3)}

/* ── EMPTY STATE ── */
#empty{display:none;padding:60px 20px;text-align:center;color:var(--t3);font-size:10px;letter-spacing:.06em;grid-column:1/-1}
#empty span{display:block;font-size:24px;opacity:.15;margin-bottom:10px}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html" class="back-btn">&#8592; catalogue</a>
  <div class="tb-div"></div>
  <span class="logo">Wave Catalogue <em>&middot;</em> Standard Objects</span>
  <div class="tb-div"></div>
  <span class="tb-stat">standard objects &middot; <strong id="ct">63</strong></span>
  <div class="tb-right">
    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input id="search" type="text" placeholder="search objects..." oninput="applyFilters()">
    </div>
    <div class="tb-div"></div>
    <button class="flt on" onclick="setGroup('all',this)">All</button>
    <button class="flt" onclick="setGroup('A',this)">Grey</button>
    <button class="flt" onclick="setGroup('B',this)">Green</button>
    <button class="flt" onclick="setGroup('C',this)">Hybrid</button>
    <button class="flt" onclick="setGroup('D',this)">Amph.</button>
    <button class="flt" onclick="setGroup('E',this)">LoTek</button>
  </div>
</div>

<div id="subbar">
  <button class="fn-flt fn-1 on" onclick="setFn('all',this)">All functions</button>
  <button class="fn-flt fn-1" onclick="setFn('1',this)">1 &middot; Edge Defense</button>
  <button class="fn-flt fn-2" onclick="setFn('2',this)">2 &middot; Shoreline Inundation</button>
  <button class="fn-flt fn-3" onclick="setFn('3',this)">3 &middot; Productive Landscapes</button>
  <button class="fn-flt fn-4" onclick="setFn('4',this)">4 &middot; Civic Living</button>
  <span id="result-count"></span>
</div>

<div id="grid"></div>

<div id="drawer">
  <div id="drawer-handle"></div>
  <div class="dr-head">
    <button class="dr-close" onclick="closeDrawer()">close &times;</button>
    <div class="dr-id" id="dr-id"></div>
    <div class="dr-name" id="dr-name"></div>
    <div class="dr-tags" id="dr-tags"></div>
  </div>
  <div class="dr-body">
    <div class="dr-diagram" id="dr-diagram"></div>
    <div class="dr-section">
      <div class="dr-sec-title">description</div>
      <div class="dr-desc" id="dr-desc"></div>
    </div>
    <div class="dr-section">
      <div class="dr-sec-title">context</div>
      <div class="dr-meta-row"><span class="dr-meta-label">scale</span><span class="dr-meta-val" id="dr-scale"></span></div>
      <div class="dr-meta-row"><span class="dr-meta-label">typology</span><span class="dr-meta-val" id="dr-cell"></span></div>
      <div class="dr-meta-row"><span class="dr-meta-label">disturbance</span>
        <div class="dr-dis-strip" id="dr-dis"></div>
      </div>
    </div>
    <div class="dr-section">
      <div class="dr-sec-title">tags</div>
      <div class="dr-tags-section" id="dr-tag-chips"></div>
    </div>
    <div class="dr-source" id="dr-source"></div>
  </div>
</div>

var REALISTIC=[{id:'re-001',name:'Coastal Revetment',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'revetment',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Sloped or stepped hard structure of rock armour, concrete units, or gabions placed on a shoreline to dissipate wave energy and resist erosion.',source:'Adaptation Measures Catalogue (Celine)',tags:['rock armour','hard engineering','wave attenuation']},{id:'re-002',name:'Offshore Parallel Breakwater',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'breakwater',disturbance:{primary:'pulse',secondary:null},desc:'Structure placed parallel to the shoreline to reduce wave energy reaching the coast. Emerged or submerged; can induce tombolo formation over time.',source:'Adaptation Measures Catalogue (Celine)',tags:['breakwater','offshore','wave energy']},{id:'re-003',name:'Nearshore Parallel Breakwater (Tombolo)',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'tombolo',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Nearshore breakwater positioned to induce sediment accumulation and tombolo formation, creating a sheltered beach landform.',source:'Adaptation Measures Catalogue (Celine)',tags:['tombolo','nearshore','sediment']},{id:'re-004',name:'Storm Surge Barrier (Movable)',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'surge_barrier',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Large-scale movable barrier that closes during storm surge events to protect hinterland. Remains open under normal tidal conditions.',source:'Adaptation Measures Catalogue (Celine)',tags:['surge barrier','movable','territorial']},{id:'re-005',name:'Offshore Closure Dam',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'closure_dam',disturbance:{primary:'ramp',secondary:'pulse'},desc:'Permanent emerged impervious dam closing off a bay or estuary from the sea. Provides absolute protection but eliminates tidal exchange.',source:'Adaptation Measures Catalogue (Celine)',tags:['closure dam','permanent','hard engineering']},{id:'re-006',name:'Dyke Raising',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'dyke',disturbance:{primary:'ramp',secondary:'sustained'},desc:'Raising the crest height of existing dykes to increase freeboard against rising sea levels and storm surges. Standard adaptive measure in low-lying deltas.',source:'Adaptation Measures Catalogue (Celine)',tags:['dyke','adaptive raising','SLR']},{id:'re-007',name:'Wave Wall',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'wave_wall',disturbance:{primary:'pulse',secondary:null},desc:'Vertical or recurved concrete wall placed at the top of a beach or revetment to deflect wave overtopping.',source:'Adaptation Measures Catalogue (Celine)',tags:['wave wall','overtopping','recurved']},{id:'re-008',name:'Watertight Flood Dyke / Embankment',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'dyke',disturbance:{primary:'sustained',secondary:'press'},desc:'Impermeable earthen or concrete embankment forming a continuous flood defence line along a shoreline or riverbank.',source:'Adaptation Measures Catalogue (Celine)',tags:['dyke','embankment','impermeable']},{id:'re-009',name:'Perpendicular Groynes',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'groynes',disturbance:{primary:'pulse',secondary:'ramp'},desc:'Shore-perpendicular structures interrupting longshore sediment transport to retain beach material.',source:'Adaptation Measures Catalogue (Celine)',tags:['groynes','longshore drift','sediment']},{id:'re-010',name:'Setback Flood Defence Wall',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'setback_wall',disturbance:{primary:'sustained',secondary:'ramp'},desc:'Flood defence line set back from the active shoreline, allowing a buffer zone to absorb initial wave energy.',source:'Adaptation Measures Catalogue (Celine)',tags:['setback','flood wall','buffer zone']},{id:'re-011',name:'Permanent Standing Flood Walls',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'flood_wall',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Fixed vertical walls of concrete or sheet piling providing permanent flood protection to urban waterfronts.',source:'Adaptation Measures Catalogue (Celine)',tags:['flood wall','permanent','sheet piling']},{id:'re-012',name:'Mobile Flood Walls',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'mobile_wall',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Demountable wall systems deployed ahead of flood events. Provides flexible protection where permanent walls are not feasible.',source:'Adaptation Measures Catalogue (Celine)',tags:['mobile','deployable','demountable']},{id:'re-013',name:'Operable Flood Barrier',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'operable_barrier',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Fixed barrier with operable gate sections allowing normal access while providing closure capacity during flood events.',source:'Adaptation Measures Catalogue (Celine)',tags:['operable','gate','flood control']},{id:'re-014',name:'Deployable Flood Barrier',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'mobile_wall',disturbance:{primary:'pulse',secondary:null},desc:'Rapid-deployment barrier system stored off-site and assembled at flood entry points for irregular flood events.',source:'Adaptation Measures Catalogue (Celine)',tags:['deployable','rapid response','temporary']},{id:'re-015',name:'Self-raising Barrier',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'operable_barrier',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Automated barrier that rises in response to rising water levels without manual intervention.',source:'Adaptation Measures Catalogue (Celine)',tags:['automatic','self-raising','passive activation']},{id:'re-016',name:'Retrofit Flood Barrier',typology_id:'1A',group:'A',fn:'1',scale:'unit',diagram:'flood_wall',disturbance:{primary:'pulse',secondary:'sustained'},desc:'Property-level barrier applied to existing door and window openings to resist floodwater entry.',source:'Adaptation Measures Catalogue (Celine)',tags:['retrofit','property-level','unit scale']},{id:'re-017',name:'Temporary Flood Barrier',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'mobile_wall',disturbance:{primary:'pulse',secondary:null},desc:'Rapidly deployable temporary barriers — sandbags, water-filled tubes, or modular panels — for emergency response.',source:'Adaptation Measures Catalogue (Celine)',tags:['temporary','sandbags','emergency']},{id:'re-018',name:'Sluice Gates',typology_id:'1A',group:'A',fn:'1',scale:'neighbourhood',diagram:'sluice',disturbance:{primary:'sustained',secondary:'press'},desc:'Controlled openings in flood defences allowing managed water flow under normal conditions with closure capacity during floods.',source:'Adaptation Measures Catalogue (Celine)',tags:['sluice','tidal gate','controlled opening']},{id:'re-019',name:'Saddle Dam',typology_id:'1A',group:'A',fn:'1',scale:'territorial',diagram:'dyke',disturbance:{primary:'sustained',secondary:'pulse'},desc:'Subsidiary dam closing a topographic low point adjacent to a main water body to prevent flanking during flood events.',source:'Adaptation Measures Catalogue (Celine)',tags:['saddle dam','flanking protection']},{id:'re-020',name:'Coastal Nourishment',typology_id:'1B',group:'B',fn:'1',scale:'territorial',diagram:'nourishment',disturbance:{primary:'pulse',secondary:'ramp'},desc:'Addition of sand or sediment to an eroding beach or dune system to restore natural wave attenuation capacity and ecological habitat.',source:'Adaptation Measures Catalogue (Celine)',tags:['nourishment','sediment','erosion management','NbS']},{id:'re-021',name:'Breakwater Reefs',typology_id:'1B',group:'B',fn:'1',scale:'neighbourhood',diagram:'reef',disturbance:{primary:'pulse',secondary:'press'},desc:'Artificial reef structures designed to reduce wave energy while promoting marine biodiversity.',source:'Adaptation Measures Catalogue (Celine)',tags:['reef','biodiversity','wave attenuation','NbS']},{id:'re-022',name:'Vegetated Sand Dune',typology_id:'1B',group:'B',fn:'1',scale:'neighbourhood',diagram:'dune',disturbance:{primary:'pulse',secondary:'ramp'},desc:'Naturally or artificially established sand dune system stabilised by coastal vegetation. Functions as a flexible energy-absorbing barrier.',source:'Adaptation Measures Catalogue (Celine)',tags:['dune','sand','vegetation','NbS']},{id:'re-023',name:'Artificial Reef Unit',typology_id:'1B',group:'B',fn:'1',scale:'neighbourhood',diagram:'reef_unit',disturbance:{primary:'pulse',secondary:'press'},desc:'Prefabricated modular reef unit placed on the seabed to attenuate waves and provide structured habitat for marine colonisation.',source:'Adaptation Measures Catalogue (Celine)',tags:['modular reef','habitat','wave reduction']},{id:'re-024',name:'Eco Tiles',typology_id:'1B',group:'B',fn:'1',scale:'unit',diagram:'eco_tiles',disturbance:{primary:'press',secondary:'pulse'},desc:'Textured tiles applied to hard coastal surfaces to provide ecological habitat for intertidal organisms while maintaining flood protection function.',source:'Adaptation Measures Catalogue (Celine)',tags:['eco tiles','intertidal','retrofit ecology']},{id:'re-025',name:'Artificial Reefs',typology_id:'1B',group:'B',fn:'1',scale:'neighbourhood',diagram:'reef',disturbance:{primary:'pulse',secondary:'press'},desc:'Submerged structures placed offshore to modify wave energy and create marine habitat at neighbourhood scale.',source:'Adaptation Measures Catalogue (Celine)',tags:['artificial reef','habitat','submerged']},{id:'re-026',name:'Flood Defence Landscape — Double Dike',typology_id:'1C',group:'C',fn:'1',scale:'territorial',diagram:'double_dike',disturbance:{primary:'ramp',secondary:'sustained'},desc:'Two parallel dike structures with an inter-dike   function water(y1,y2){return `<rect x="0" y="${y1}" width="${W}" height="${y2-y1}" fill="${wf}"/>`}
  function gnd(y){return `<rect x="0" y="${y}" width="${W}" height="${H-y}" fill="${gf}"/>`}

// ── HELPERS ────────────────────────────────────────────────────────────
function pips(s){return[1,2,3].map(i=>`<div class="sp${i<=SP[s]?' on':''}"></div>`).join('')}
function disSlot(regime,p,s){
  const L={pulse:'pulse',sustained:'sust.',press:'press',ramp:'ramp'};
  let c='off';
  if(regime===p)c=regime+'-p';
  else if(regime===s)c=regime+'-s';
  return `<div class="ds ${c}"><span class="ds-lbl">${L[regime]}</span></div>`;
}
function disStrip(d){return['pulse','sustained','press','ramp'].map(r=>disSlot(r,d.primary,d.secondary)).join('')}
function cellBadgeStyle(g){
  const cols={A:'rgba(136,135,128,0.4)',B:'rgba(99,153,34,0.4)',C:'rgba(127,119,221,0.4)',D:'rgba(55,138,221,0.4)',E:'rgba(239,159,39,0.4)'};
  const tc={A:'#888780',B:'#639922',C:'#7F77DD',D:'#378ADD',E:'#EF9F27'};
  return `border-color:${cols[g]};color:${tc[g]}`;
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const items=REALISTIC.filter(r=>{
    if(activeGroup!=='all'&&r.group!==activeGroup)return false;
    if(activeFn!=='all'&&r.fn!==activeFn)return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!r.tags.some(t=>t.includes(q))&&!r.desc.toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById('ct').textContent=REALISTIC.length;
  document.getElementById('result-count').textContent=`${items.length} of ${REALISTIC.length} shown`;
  const grid=document.getElementById('grid');
  if(items.length===0){
    grid.innerHTML=`<div id="empty" style="display:block;padding:60px 20px;text-align:center;color:var(--t3);font-size:10px;grid-column:1/-1"><span style="display:block;font-size:28px;opacity:.12;margin-bottom:10px">&#9676;</span>no objects match this filter</div>`;
    return;
  }
  grid.innerHTML=items.map(r=>`
<div class="cell-bg">
<div class="cpm-card${activeCard===r.id?' active':''}" onclick="openDrawer('${r.id}')">
  <div class="dz">
    ${svgDiagram(r.diagram,290,148)}
    <div class="cell-badge" style="${cellBadgeStyle(r.group)}">${r.typology_id}</div>
    <div class="scale-pips">${pips(r.scale)}</div>
  </div>
  <div class="cb">
    <div class="card-top">
      <div class="card-name">${r.name}</div>
      <div class="card-id">${r.id}</div>
    </div>
    <div class="card-tags">
      <span class="tag tag-${r.group}">${GN[r.group]}</span>
      <span class="tag tag-fn">${FN[r.fn]}</span>
    </div>
    <div class="card-desc">${r.desc}</div>
    <div class="scale-label">scale: <span>${SL[r.scale]}</span></div>
    <div class="dis-strip">${disStrip(r.disturbance)}</div>
  </div>
</div>
</div>`).join('');
}

// ── DRAWER ─────────────────────────────────────────────────────────────
function openDrawer(id){
  const r=REALISTIC.find(x=>x.id===id);
  if(!r)return;
  activeCard=id;
  document.getElementById('dr-id').textContent=`${r.id} · ${r.typology_id}`;
  document.getElementById('dr-name').textContent=r.name;
  document.getElementById('dr-tags').innerHTML=`<span class="tag tag-${r.group}">${GN[r.group]}</span><span class="tag tag-fn">${FN[r.fn]}</span><span class="tag tag-fn" style="border-color:var(--bd2)">${SL[r.scale]}</span>`;
  document.getElementById('dr-diagram').innerHTML=svgDiagram(r.diagram,328,160);
  document.getElementById('dr-desc').textContent=r.desc;
  document.getElementById('dr-scale').textContent=SL[r.scale];
  document.getElementById('dr-cell').textContent=`${r.typology_id} · ${GN[r.group]} / ${FN[r.fn]}`;
  document.getElementById('dr-dis').innerHTML=disStrip(r.disturbance);
  document.getElementById('dr-tag-chips').innerHTML=r.tags.map(t=>`<span class="dr-tag-chip">${t}</span>`).join('');
  document.getElementById('dr-source').textContent=`source: ${r.source}`;
  document.getElementById('drawer').classList.add('open');
  render();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  activeCard=null;
  render();
}

// ── FILTERS ────────────────────────────────────────────────────────────
function setGroup(g,btn){
  activeGroup=g;
  document.querySelectorAll('.tb-right .flt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function setFn(f,btn){
  activeFn=f;
  document.querySelectorAll('.fn-flt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function applyFilters(){render()}

render();

// ── DRAWER RESIZE ──────────────────────────────────────────────────────
(function(){
  const handle=document.getElementById('drawer-handle');
  const drawer=document.getElementById('drawer');
  let dragging=false;
  handle.addEventListener('mousedown',function(e){
    dragging=true;
    drawer.classList.add('resizing');
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    const w=window.innerWidth-e.clientX;
    const min=parseInt(getComputedStyle(drawer).minWidth)||260;
    const max=window.innerWidth*0.9;
    drawer.style.width=Math.max(min,Math.min(max,w))+'px';
  });
  document.addEventListener('mouseup',function(){
    if(dragging){dragging=false;drawer.classList.remove('resizing');}
  });
})();
</script>
