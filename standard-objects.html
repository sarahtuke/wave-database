<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Catalogue · Standard Objects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1015;--bg2:#141720;--bg3:#1a1d25;--bg4:#21252e;--bg5:#262a34;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);--bd3:rgba(255,255,255,0.22);
  --t1:#dedad0;--t2:#8a8880;--t3:#4e4d4a;--t4:#2b2a28;
  --ac:#7F77DD;--ac2:#EF9F27;
  --cA:#888780;--cB:#639922;--cC:#7F77DD;--cD:#378ADD;--cE:#EF9F27;
  --pulse:#EF9F27;--sustained:#378ADD;--press:#7F77DD;--ramp:#D85A30;
}
html,body{background:var(--bg);color:var(--t1);font-family:'Courier New',monospace;font-size:12px;min-height:100vh}

/* ── TOPBAR ── */
#topbar{height:42px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:100}
.logo{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--t1)}
.logo em{color:var(--t3);font-style:normal}
.tb-div{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.tb-stat{font-size:9px;color:var(--t3);white-space:nowrap}
.tb-stat strong{color:var(--t2)}
.tb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
.flt{font-size:9px;padding:3px 10px;border:1px solid var(--bd);border-radius:4px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s;white-space:nowrap}
.flt:hover{border-color:var(--bd2);color:var(--t2)}
.flt.on{border-color:rgba(127,119,221,.5);color:var(--ac);background:rgba(127,119,221,.07)}
#ws-btn.on{border-color:rgba(239,159,39,.5);color:var(--ac2);background:rgba(239,159,39,.07)}
.search-wrap{position:relative}
#search{background:var(--bg3);border:1px solid var(--bd);color:var(--t1);font-family:'Courier New',monospace;font-size:9px;padding:3px 10px 3px 24px;border-radius:4px;width:160px;outline:none;letter-spacing:.03em}
#search::placeholder{color:var(--t3)}
#search:focus{border-color:var(--bd2)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--t3);pointer-events:none}
.back-btn{font-size:9px;padding:3px 10px;border:1px solid var(--bd);border-radius:4px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s;text-decoration:none;display:flex;align-items:center;gap:5px}
.back-btn:hover{border-color:var(--bd2);color:var(--t2)}

/* ── SUBBAR ── */
#subbar{height:34px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:8px;position:sticky;top:42px;z-index:99}
.fn-flt{font-size:8px;padding:2px 8px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--t3);cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.04em;transition:all .12s}
.fn-flt:hover{border-color:var(--bd2);color:var(--t2)}
.fn-flt.on{border-color:var(--fn-col,var(--bd2));color:var(--fn-col,var(--t2));background:var(--fn-bg,transparent)}
.fn-1{--fn-col:rgba(136,135,128,0.8);--fn-bg:rgba(136,135,128,0.06)}
.fn-2{--fn-col:rgba(55,138,221,0.8);--fn-bg:rgba(55,138,221,0.06)}
.fn-3{--fn-col:rgba(99,153,34,0.8);--fn-bg:rgba(99,153,34,0.06)}
.fn-4{--fn-col:rgba(159,119,221,0.8);--fn-bg:rgba(159,119,221,0.06)}
#result-count{margin-left:auto;font-size:9px;color:var(--t3)}

/* ── GRID ── */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--bd);min-height:200px}
.cell-bg{background:var(--bg)}

/* ── CARD ── */
.cpm-card{background:var(--bg3);display:flex;flex-direction:column;height:100%;cursor:pointer;transition:background .12s}
.cpm-card:hover{background:var(--bg4)}
.cpm-card.active{background:var(--bg4);outline:1px solid var(--ac)}

/* diagram zone */
.dz{height:148px;background:var(--bg2);border-bottom:1px solid var(--bd);position:relative;overflow:hidden;flex-shrink:0}
.dz svg{width:100%;height:100%}
.scale-pips{position:absolute;bottom:8px;right:8px;display:flex;gap:2px}
.sp{width:5px;height:5px;border-radius:50%;background:var(--t4);transition:background .2s}
.sp.on{background:var(--ac2)}
.cell-badge{position:absolute;top:8px;left:8px;font-size:7px;letter-spacing:.07em;padding:2px 6px;border-radius:3px;border:1px solid;background:var(--bg)}

/* card body */
.cb{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card-name{font-size:10px;font-weight:bold;color:var(--t1);line-height:1.35;flex:1}
.card-id{font-size:8px;color:var(--t3);flex-shrink:0;margin-top:1px;letter-spacing:.04em}
.card-tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:.04em}
.tag-A{border-color:rgba(136,135,128,.3);color:#888780}
.tag-B{border-color:rgba(99,153,34,.3);color:#639922}
.tag-C{border-color:rgba(127,119,221,.3);color:#7F77DD}
.tag-D{border-color:rgba(55,138,221,.3);color:#378ADD}
.tag-E{border-color:rgba(239,159,39,.3);color:#EF9F27}
.tag-fn{border-color:var(--bd2);color:var(--t2)}
.card-desc{font-size:9px;color:var(--t2);line-height:1.6}
.scale-label{font-size:8px;color:var(--t3)}
.scale-label span{color:var(--ac2)}

/* disturbance strip */
.dis-strip{display:flex;gap:3px;margin-top:auto;padding-top:8px;border-top:1px solid var(--bd)}
.ds{flex:1;height:20px;border-radius:3px;border:1px solid;display:flex;align-items:center;justify-content:center}
.ds-lbl{font-size:7px;letter-spacing:.02em}
.ds.pulse-p{background:rgba(239,159,39,.1);border-color:rgba(239,159,39,.5)}.ds.pulse-p .ds-lbl{color:#EF9F27}
.ds.pulse-s{background:transparent;border-color:rgba(239,159,39,.25)}.ds.pulse-s .ds-lbl{color:rgba(239,159,39,.5)}
.ds.sustained-p{background:rgba(55,138,221,.1);border-color:rgba(55,138,221,.5)}.ds.sustained-p .ds-lbl{color:#378ADD}
.ds.sustained-s{background:transparent;border-color:rgba(55,138,221,.25)}.ds.sustained-s .ds-lbl{color:rgba(55,138,221,.5)}
.ds.press-p{background:rgba(127,119,221,.1);border-color:rgba(127,119,221,.5)}.ds.press-p .ds-lbl{color:#7F77DD}
.ds.press-s{background:transparent;border-color:rgba(127,119,221,.25)}.ds.press-s .ds-lbl{color:rgba(127,119,221,.5)}
.ds.ramp-p{background:rgba(216,90,48,.1);border-color:rgba(216,90,48,.5)}.ds.ramp-p .ds-lbl{color:#D85A30}
.ds.ramp-s{background:transparent;border-color:rgba(216,90,48,.25)}.ds.ramp-s .ds-lbl{color:rgba(216,90,48,.5)}
.ds.off{background:transparent;border-color:var(--bd);opacity:.25}.ds.off .ds-lbl{color:var(--t3)}

/* ── DETAIL DRAWER ── */
#drawer{position:fixed;right:0;top:0;bottom:0;width:360px;min-width:260px;max-width:90vw;background:var(--bg2);border-left:1px solid var(--bd2);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:200;display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translateX(0)}
#drawer.resizing{transition:none;user-select:none}
#drawer-handle{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:10;background:transparent}
#drawer-handle:hover,#drawer-handle:active{background:rgba(127,119,221,0.18)}
.dr-head{padding:14px 16px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dr-close{position:absolute;top:12px;right:14px;background:none;border:1px solid var(--bd);color:var(--t2);cursor:pointer;font-size:9px;padding:2px 8px;border-radius:3px;font-family:'Courier New',monospace;letter-spacing:.04em}
.dr-close:hover{border-color:var(--bd2);color:var(--t1)}
.dr-id{font-size:8px;letter-spacing:.1em;color:var(--t3);margin-bottom:4px}
.dr-name{font-size:14px;color:var(--t1);line-height:1.3;margin-bottom:8px;padding-right:60px}
.dr-tags{display:flex;gap:3px;flex-wrap:wrap}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px}
.dr-diagram{height:160px;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.dr-diagram svg{width:100%;height:100%}
.dr-section{margin-bottom:14px}
.dr-sec-title{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.dr-desc{font-size:9px;color:var(--t2);line-height:1.65}
.dr-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:9px}
.dr-meta-label{color:var(--t3);width:72px;flex-shrink:0;font-size:8px;letter-spacing:.04em}
.dr-meta-val{color:var(--t2)}
.dr-dis-strip{display:flex;gap:3px}
.dr-source{font-size:8px;color:var(--t3);font-style:italic;border-top:1px solid var(--bd);padding-top:10px;margin-top:2px}
.dr-tags-section{display:flex;flex-wrap:wrap;gap:3px}
.dr-tag-chip{font-size:8px;padding:2px 7px;border-radius:3px;background:var(--bg3);border:1px solid var(--bd);color:var(--t3)}

/* ── EMPTY STATE ── */
#empty{display:none;padding:60px 20px;text-align:center;color:var(--t3);font-size:10px;letter-spacing:.06em;grid-column:1/-1}
#empty span{display:block;font-size:24px;opacity:.15;margin-bottom:10px}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html" class="back-btn">&#8592; catalogue</a>
  <div class="tb-div"></div>
  <span class="logo">Wave Catalogue <em>&middot;</em> Standard Objects</span>
  <div class="tb-div"></div>
  <span class="tb-stat">standard objects &middot; <strong id="ct">63</strong></span>
  <div class="tb-right">
    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input id="search" type="text" placeholder="search objects..." oninput="applyFilters()">
    </div>
    <div class="tb-div"></div>
    <button class="flt on" onclick="setGroup('all',this)">All</button>
    <button class="flt" onclick="setGroup('Grey',this)">Grey</button>
    <button class="flt" onclick="setGroup('Green',this)">Green</button>
    <button class="flt" onclick="setGroup('Hybrid',this)">Hybrid</button>
  </div>
</div>

<div id="subbar">
  <span id="result-count"></span>
</div>

<div id="grid"></div>

<div id="drawer">
  <div id="drawer-handle"></div>
  <div class="dr-head">
    <button class="dr-close" onclick="closeDrawer()">close &times;</button>
    <div class="dr-id" id="dr-id"></div>
    <div class="dr-name" id="dr-name"></div>
    <div class="dr-tags" id="dr-tags"></div>
  </div>
  <div class="dr-body">
    <div class="dr-diagram" id="dr-diagram"></div>
    <div class="dr-section">
      <div class="dr-sec-title">description</div>
      <div class="dr-desc" id="dr-desc"></div>
    </div>
    <div class="dr-section">
      <div class="dr-sec-title">context</div>
      <div class="dr-meta-row"><span class="dr-meta-label">scale</span><span class="dr-meta-val" id="dr-scale"></span></div>
      <div class="dr-meta-row"><span class="dr-meta-label">typology</span><span class="dr-meta-val" id="dr-cell"></span></div>
      <div class="dr-meta-row"><span class="dr-meta-label">disturbance</span>
        <div class="dr-dis-strip" id="dr-dis"></div>
      </div>
    </div>
    <div class="dr-section">
      <div class="dr-sec-title">tags</div>
      <div class="dr-tags-section" id="dr-tag-chips"></div>
    </div>
    <div class="dr-source" id="dr-source"></div>
  </div>
</div>

<script src="data/standard.js"></script>
<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────
// Catalogue data loads from data/standard.js (var STANDARD) — this page is
// presentation only and holds no catalogue data of its own.
const MAT_COLORS={Grey:'#8a8880',Green:'#1D9E75',Hybrid:'#7F77DD'};
const SL={unit:'unit · 1–10 m',neighbourhood:'neighbourhood · 10–100 m',territorial:'territorial · 100 m+'};
const SP={unit:1,neighbourhood:2,territorial:3};

let activeGroup='all', activeCard=null;

function locationLabel(location){
  if(!location)return'–';
  if(location.type==='Point')return location.position;
  if(location.type==='Span')return`${location.start} → ${location.end}`;
  if(location.type==='Discrete-multi')return(location.positions||[]).join(' + ');
  return'–';
}

// ── SVG DIAGRAMS ───────────────────────────────────────────────────────
function svgDiagram(t,W,H){
  W=W||290; H=H||148;
  const nat='rgba(99,153,34,0.72)',str='rgba(127,119,221,0.72)',
        wf='rgba(55,138,221,0.16)',wl='rgba(55,138,221,0.45)',
        gf='rgba(136,135,128,0.2)',lc='rgba(120,118,112,0.85)';
  function lbl(x,y,txt,a){return `<text x="${x}" y="${y}" font-family="Courier New" font-size="${W>250?7:6}" fill="${lc}" text-anchor="${a||'middle'}" letter-spacing="0.04em">${txt}</text>`}
  function water(y1,y2){return `<rect x="0" y="${y1}" width="${W}" height="${y2-y1}" fill="${wf}"/>`}
  function gnd(y){return `<rect x="0" y="${y}" width="${W}" height="${H-y}" fill="${gf}"/>`}
  function wline(y){return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${wl}" stroke-width="0.5" stroke-dasharray="4 3"/>`}
  const pre=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const suf=`</svg>`;
  const diagrams={
    revetment:()=>pre+water(58,108)+wline(58)+gnd(108)+`<polygon points="38,108 108,108 92,58 48,58" fill="${str}" opacity="0.75"/>`+lbl(75,48,'revetment face')+lbl(190,76,'sea level')+suf,
    breakwater:()=>pre+water(40,130)+wline(40)+gnd(130)+`<path d="M90,130 L108,70 L178,70 L196,130 Z" fill="${str}" opacity="0.75"/>`+lbl(144,62,'breakwater')+lbl(44,55,'sea')+lbl(238,55,'sheltered')+suf,
    tombolo:()=>pre+water(40,125)+wline(40)+gnd(125)+`<path d="M85,125 L100,72 L165,72 L180,125 Z" fill="${str}" opacity="0.7"/>`+`<path d="M132,125 Q145,110 155,125" fill="${nat}" opacity="0.5"/>`+lbl(132,62,'nearshore breakwater')+lbl(145,118,'tombolo')+suf,
    surge_barrier:()=>pre+water(50,115)+wline(50)+gnd(115)+`<rect x="18" y="55" width="11" height="60" fill="${str}" opacity="0.9"/><rect x="261" y="55" width="11" height="60" fill="${str}" opacity="0.9"/><rect x="29" y="66" width="66" height="8" fill="${str}" opacity="0.6"/><rect x="195" y="66" width="66" height="8" fill="${str}" opacity="0.6"/><line x1="95" y1="70" x2="195" y2="70" stroke="${str}" stroke-width="1.5" stroke-dasharray="6 4"/>`+lbl(145,58,'surge gate (open)')+lbl(50,44,'sea')+lbl(230,44,'harbour')+suf,
    closure_dam:()=>pre+water(50,115)+wline(50)+gnd(115)+`<rect x="90" y="50" width="110" height="65" fill="${str}" opacity="0.7"/>`+lbl(145,42,'closure dam')+lbl(44,44,'sea')+lbl(240,44,'enclosed')+suf,
    dyke:()=>pre+water(65,115)+wline(65)+gnd(115)+`<polygon points="28,115 262,115 228,65 58,65" fill="${str}" opacity="0.7"/><line x1="58" y1="65" x2="228" y2="65" stroke="rgba(239,159,39,0.7)" stroke-width="1" stroke-dasharray="4 3"/>`+lbl(145,58,'crest','middle','rgba(239,159,39,0.9)')+lbl(28,52,'sea')+lbl(262,52,'land','end')+suf,
    wave_wall:()=>pre+water(60,115)+wline(60)+gnd(115)+`<rect x="120" y="115" width="6" height="60" fill="${str}" opacity="0.8"/>`+`<path d="M126,56 Q138,52 132,62 L126,68 Z" fill="${str}" opacity="0.8"/>`+lbl(80,50,'wave')+lbl(200,50,'protected')+suf,
    groynes:()=>pre+water(50,120)+wline(50)+gnd(120)+[80,140,200].map(x=>`<rect x="${x}" y="55" width="8" height="65" fill="${str}" opacity="0.7"/>`).join('')+lbl(145,42,'groynes')+lbl(28,46,'longshore drift →')+suf,
    setback_wall:()=>pre+water(50,115)+wline(50)+gnd(115)+`<path d="M30,115 Q80,95 130,90" stroke="${nat}" stroke-width="8" fill="none" opacity="0.6"/>`+`<rect x="175" y="68" width="8" height="47" fill="${str}" opacity="0.8"/>`+lbl(80,80,'buffer foreshore')+lbl(210,60,'setback wall')+suf,
    flood_wall:()=>pre+water(65,115)+wline(65)+gnd(115)+`<rect x="135" y="115" width="6" height="55" fill="${str}" opacity="0.85"/>`+lbl(60,55,'protected zone')+lbl(220,55,'flood zone')+suf,
    mobile_wall:()=>pre+water(65,115)+wline(65)+gnd(115)+[110,125,140,155,170].map(x=>`<rect x="${x}" y="68" width="10" height="47" fill="${str}" opacity="0.7" rx="1"/>`).join('')+lbl(145,58,'deployable panels')+suf,
    operable_barrier:()=>pre+water(62,115)+wline(62)+gnd(115)+`<rect x="100" y="115" width="8" height="52" fill="${str}" opacity="0.8"/><rect x="182" y="115" width="8" height="52" fill="${str}" opacity="0.8"/><line x1="108" y1="72" x2="182" y2="72" stroke="${str}" stroke-width="2" stroke-dasharray="5 3"/>`+lbl(145,58,'operable gate (open)')+suf,
    sluice:()=>pre+water(60,115)+wline(60)+gnd(115)+`<rect x="100" y="65" width="90" height="50" fill="${str}" opacity="0.4"/><rect x="130" y="80" width="30" height="35" fill="${wf}" opacity="0.8"/>`+lbl(145,56,'sluice gate')+lbl(145,100,'opening')+suf,
    double_dike:()=>pre+water(58,125)+wline(58)+gnd(125)+`<polygon points="18,125 62,125 52,70 28,70" fill="${str}" opacity="0.8"/><polygon points="192,125 236,125 226,70 202,70" fill="${str}" opacity="0.8"/><rect x="62" y="88" width="130" height="37" fill="rgba(55,138,221,0.2)"/>`+lbl(127,80,'inter-dike zone')+lbl(38,65,'outer')+lbl(214,65,'inner')+suf,
    perched_beach:()=>pre+water(48,122)+wline(48)+gnd(122)+`<rect x="58" y="102" width="174" height="20" fill="rgba(136,135,128,0.4)"/><path d="M58,102 Q100,82 145,77 Q188,72 232,78 L232,102 Z" fill="rgba(210,190,150,0.28)"/>`+lbl(145,68,'beach sediment')+lbl(145,114,'submerged sill')+suf,
    barrier_island:()=>pre+water(35,128)+wline(35)+gnd(128)+`<path d="M70,128 Q110,102 145,98 Q180,102 220,128 Z" fill="${nat}" opacity="0.55"/>`+`<path d="M80,128 Q115,108 145,104 Q175,108 210,128" fill="rgba(210,190,150,0.3)"/>`+lbl(145,90,'barrier island')+lbl(28,30,'open sea')+lbl(238,30,'sheltered')+suf,
    eco_revetment:()=>pre+water(58,108)+wline(58)+gnd(108)+`<polygon points="38,108 108,108 92,58 48,58" fill="${str}" opacity="0.6"/>`+[55,65,75,85,95].map(x=>`<circle cx="${x}" cy="${108-Math.floor(x/10)}" r="3" fill="${nat}" opacity="0.7"/>`).join('')+lbl(160,72,'ecological overlay')+suf,
    nourishment:()=>pre+water(50,120)+wline(50)+gnd(120)+`<path d="M50,120 Q100,98 145,94 Q188,90 240,98 L240,120 Z" fill="rgba(210,190,150,0.32)"/>`+lbl(145,84,'nourished beach profile')+lbl(28,44,'sea')+suf,
    reef:()=>pre+water(35,132)+wline(35)+gnd(132)+`<path d="M88,132 L98,108 L108,112 L118,104 L128,112 L138,106 L148,112 L158,132 Z" fill="${nat}" opacity="0.65"/>`+lbl(120,94,'reef')+lbl(38,28,'wave approach')+lbl(238,28,'sheltered')+suf,
    reef_unit:()=>pre+water(38,132)+wline(38)+gnd(132)+`<path d="M110,132 L120,110 L130,116 L140,106 L150,116 L160,132 Z" fill="${nat}" opacity="0.7"/><rect x="108" y="130" width="54" height="4" fill="${str}" opacity="0.4"/>`+lbl(135,96,'reef unit')+lbl(38,30,'sea')+suf,

// ── HELPERS ────────────────────────────────────────────────────────────
function pips(s){return[1,2,3].map(i=>`<div class="sp${i<=SP[s]?' on':''}"></div>`).join('')}
function disSlot(regime,p,s){
  const L={pulse:'pulse',sustained:'sust.',press:'press',ramp:'ramp'};
  let c='off';
  if(regime===p)c=regime+'-p';
  else if(regime===s)c=regime+'-s';
  return `<div class="ds ${c}"><span class="ds-lbl">${L[regime]}</span></div>`;
}
function disStrip(d){return['pulse','sustained','press','ramp'].map(r=>disSlot(r,d.primary,d.secondary)).join('')}
function cellBadgeStyle(material){
  const c=MAT_COLORS[material]||'#888';
  return `border-color:${c}66;color:${c}`;
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const items=STANDARD.filter(r=>{
    if(activeGroup!=='all'&&r.material!==activeGroup)return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!(r.tags||[]).some(t=>t.includes(q))&&!(r.desc||'').toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById('ct').textContent=STANDARD.length;
  document.getElementById('result-count').textContent=`${items.length} of ${STANDARD.length} shown`;
  const grid=document.getElementById('grid');
  if(items.length===0){
    grid.innerHTML=`<div id="empty" style="display:block;padding:60px 20px;text-align:center;color:var(--t3);font-size:10px;grid-column:1/-1"><span style="display:block;font-size:28px;opacity:.12;margin-bottom:10px">&#9676;</span>no objects match this filter</div>`;
    return;
  }
  grid.innerHTML=items.map(r=>{
    const mc=MAT_COLORS[r.material]||'#888';
    return `
<div class="cell-bg">
<div class="cpm-card${activeCard===r.id?' active':''}" onclick="openDrawer('${r.id}')">
  <div class="dz">
    ${svgDiagram(r.diagram,290,148)}
    <div class="cell-badge" style="${cellBadgeStyle(r.material)}">${r.newCode}</div>
    <div class="scale-pips">${pips(r.scale)}</div>
  </div>
  <div class="cb">
    <div class="card-top">
      <div class="card-name">${r.name}</div>
      <div class="card-id">${r.id}</div>
    </div>
    <div class="card-tags">
      <span class="tag" style="border-color:${mc}4d;color:${mc}">${r.material}</span>
      <span class="tag tag-fn">${locationLabel(r.location)}</span>
    </div>
    <div class="card-desc">${r.desc}</div>
    <div class="scale-label">scale: <span>${SL[r.scale]}</span></div>
    <div class="dis-strip">${disStrip(r.disturbance)}</div>
  </div>
</div>
</div>`;
  }).join('');
}

// ── DRAWER ─────────────────────────────────────────────────────────────
function openDrawer(id){
  const r=STANDARD.find(x=>x.id===id);
  if(!r)return;
  activeCard=id;
  const mc=MAT_COLORS[r.material]||'#888';
  document.getElementById('dr-id').textContent=`${r.id} · ${r.newCode}`;
  document.getElementById('dr-name').textContent=r.name;
  document.getElementById('dr-tags').innerHTML=`<span class="tag" style="border-color:${mc}4d;color:${mc}">${r.material}</span><span class="tag tag-fn">${locationLabel(r.location)}</span><span class="tag tag-fn" style="border-color:var(--bd2)">${SL[r.scale]}</span>`;
  document.getElementById('dr-diagram').innerHTML=svgDiagram(r.diagram,328,160);
  document.getElementById('dr-desc').textContent=r.desc;
  document.getElementById('dr-scale').textContent=SL[r.scale];
  document.getElementById('dr-cell').textContent=`${r.newCode} · ${r.material} / ${locationLabel(r.location)}`;
  document.getElementById('dr-dis').innerHTML=disStrip(r.disturbance);
  document.getElementById('dr-tag-chips').innerHTML=(r.tags||[]).map(t=>`<span class="dr-tag-chip">${t}</span>`).join('');
  document.getElementById('dr-source').textContent=`source: ${r.source}`;
  document.getElementById('drawer').classList.add('open');
  render();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  activeCard=null;
  render();
}

// ── FILTERS ────────────────────────────────────────────────────────────
function setGroup(g,btn){
  activeGroup=g;
  document.querySelectorAll('.tb-right .flt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function applyFilters(){render()}

render();

// ── DRAWER RESIZE ──────────────────────────────────────────────────────
(function(){
  const handle=document.getElementById('drawer-handle');
  const drawer=document.getElementById('drawer');
  let dragging=false;
  handle.addEventListener('mousedown',function(e){
    dragging=true;
    drawer.classList.add('resizing');
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    const w=window.innerWidth-e.clientX;
    const min=parseInt(getComputedStyle(drawer).minWidth)||260;
    const max=window.innerWidth*0.9;
    drawer.style.width=Math.max(min,Math.min(max,w))+'px';
  });
  document.addEventListener('mouseup',function(){
    if(dragging){dragging=false;drawer.classList.remove('resizing');}
  });
})();
</script>
